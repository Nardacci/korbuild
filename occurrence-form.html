<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KORbuild · Occurrence</title><link rel="stylesheet" href="home.css?v=1.2.2"><link rel="stylesheet" href="occurrence-form.css?v=1.2.2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js?v=1.2.2"></script><script src="supabase-config.js?v=1.2.3"></script></head><body class="app-body"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="home.html" aria-label="KORbuild Dashboard"><div class="mini-mark">K</div><div>KOR<span>build</span></div><span class="demo-badge logo-demo">DEMO</span></a><nav></nav><div class="side-bottom"><a class="nav-item" href="setup.html"><span>⚙</span>Workspace Setup</a></div></aside><main class="main-content"><header class="topbar page-topbar"><div class="topbar-page-context"><div class="breadcrumb">WORKSPACE / OCCURRENCES / <span id="crumb-mode">NEW</span></div><div class="page-title" id="page-title">New Occurrence</div></div><div class="user-menu-wrap"><button id="user-menu-btn" class="user-menu-btn" aria-expanded="false"><span class="user-copy"><strong id="user-name">Owner</strong><small id="user-email"></small></span><span class="avatar" id="user-avatar">O</span><span class="chevron">⌄</span></button><div id="user-menu" class="user-menu hidden"></div></div></header><section class="form-page"><div class="form-card"><div class="form-intro"><div class="eyebrow">OCCURRENCE CATALOG</div><h1>Configure an occurrence.</h1><p>This is the occurrence type available to evaluators. Applying it to a person happens later in Evaluations.</p></div><form id="occurrence-form"><div class="form-grid"><label><span>Name *</span><input id="name" required maxlength="120" placeholder="e.g. Late arrival"></label><label><span>Points *</span><input id="points" type="number" min="0" step="1" value="0" required></label><label class="full"><span>Description</span><textarea id="description" rows="4" maxlength="500" placeholder="Describe when this occurrence should be applied."></textarea></label><label><span>Type *</span><select id="occurrence-type"><option value="NEGATIVA">Negative</option><option value="POSITIVA">Positive</option></select></label><label class="switch-field"><span>Active</span><span class="switch-line"><input id="active" type="checkbox" checked><b id="active-label">Active</b></span></label></div><div id="message" class="message hidden"></div><div class="form-actions"><a class="secondary-btn" href="occurrences.html">Cancel</a><button class="primary-btn" type="submit" id="save-btn">Save Occurrence</button></div></form></div></section></main><div class="app-version">KORbuild V1.2.2 · Development environment</div></div><script src="occurrence-form.js?v=editfix2"></script></body></html>
