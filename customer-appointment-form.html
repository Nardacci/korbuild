<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KORbuild · New Appointment</title><link rel="stylesheet" href="home.css?v=26"><link rel="stylesheet" href="occurrence-form.css?v=1.2.2"><link rel="stylesheet" href="customer-appointment-form.css?v=1.0.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js?v=1.2.2"></script><script src="supabase-config.js?v=1.3.3"></script><script src="notification-bell.js?v=1.0.0"></script><script src="i18n.js?v=1.8.0"></script></head><body class="app-body"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="home.html" aria-label="KORbuild Dashboard"><div class="mini-mark">K</div><div>KOR<span>build</span></div><span class="demo-badge logo-demo">DEMO</span></a><nav></nav></aside><main class="main-content"><header class="topbar page-topbar"><div class="topbar-page-context page-identity"><strong>New Appointment</strong><small>Book a service appointment for a client.</small></div><div class="user-menu-wrap"><button id="user-menu-btn" class="user-menu-btn" aria-expanded="false"><span class="user-copy"><strong id="user-name">Owner</strong><small id="user-email"></small></span><span class="avatar" id="user-avatar">O</span><span class="chevron">⌄</span></button><div id="user-menu" class="user-menu hidden"></div></div></header><section class="form-page"><div class="form-card"><form id="appointment-form"><div class="form-grid">

<label class="full"><span>Client *</span><div class="inline-row"><select id="cliente-id"><option value="">Select a client</option></select><button type="button" id="toggle-new-client" class="secondary-btn">+ New client</button></div></label>
<div id="new-client-panel" class="full inline-panel hidden">
  <div class="form-grid">
    <label><span>Name *</span><input id="new-client-nome" maxlength="150"></label>
    <label><span>Email *</span><input id="new-client-email" type="email" maxlength="200"></label>
    <label><span>Phone</span><input id="new-client-telefone" maxlength="40"></label>
  </div>
</div>

<label class="full"><span>Service *</span><div class="inline-row"><select id="servico-id"><option value="">Select a service</option></select><button type="button" id="toggle-new-service" class="secondary-btn">+ New service</button></div></label>
<div id="new-service-panel" class="full inline-panel hidden">
  <div class="form-grid">
    <label><span>Name *</span><input id="new-service-nome" maxlength="150"></label>
    <label><span>Duration (minutes) *</span><input id="new-service-duracao" type="number" min="5" step="5" value="60"></label>
    <label><span>Default price *</span><input id="new-service-preco" type="number" min="0" step="0.01" value="0"></label>
  </div>
</div>

<label><span>Collaborator *</span><select id="colaborador-id" required><option value="">Select a collaborator</option></select></label>
<label><span>Date *</span><input id="data" type="date" required></label>
<label><span>Start time *</span><input id="hora-inicio" type="time" required></label>
<label><span>End time *</span><input id="hora-fim" type="time" required></label>
<label class="full"><span>Notes</span><textarea id="observacoes" rows="3" maxlength="500"></textarea></label>

</div><div id="message" class="message hidden"></div><div class="form-actions"><a class="secondary-btn" href="customer-schedule.html">Cancel</a><button class="primary-btn" type="submit" id="save-btn">Save Appointment</button></div></form></div></section></main><div class="app-version">KORbuild V1.2.2 · Development environment</div></div><script src="customer-appointment-form.js?v=1.0.0"></script></body></html>
