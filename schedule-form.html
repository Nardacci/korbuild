<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KORbuild · New Schedule Entry</title><link rel="stylesheet" href="home.css?v=26"><link rel="stylesheet" href="occurrence-form.css?v=1.2.2"><style>.form-hint{margin:0;padding:11px 13px;border-radius:10px;background:#fff4df;color:#a86200;font-size:11px;font-weight:600}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js?v=1.2.3"></script><script src="supabase-config.js?v=1.3.4"></script><script src="notification-bell.js?v=1.0.0"></script><script src="i18n.js?v=2.2.1"></script></head><body class="app-body"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="home.html" aria-label="KORbuild Dashboard"><div class="mini-mark">K</div><div>KOR<span>build</span></div><span class="demo-badge logo-demo">DEMO</span></a><nav></nav></aside><main class="main-content"><header class="topbar page-topbar"><div class="topbar-page-context page-identity"><strong id="page-title">New Schedule Entry</strong><small>Request a shift, vacation, day off or commitment for a person.</small></div><div class="user-menu-wrap"><button id="user-menu-btn" class="user-menu-btn" aria-expanded="false"><span class="user-copy"><strong id="user-name">Owner</strong><small id="user-email"></small></span><span class="avatar" id="user-avatar">O</span><span class="chevron">⌄</span></button><div id="user-menu" class="user-menu hidden"></div></div></header><section class="form-page"><div class="form-card"><form id="schedule-form"><div class="form-grid">
