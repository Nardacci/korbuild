<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KORbuild · Workspace</title><link rel="stylesheet" href="style.css">
<style>body{display:flex;align-items:center;justify-content:center;padding:24px}.workspace{width:min(1100px,100%);background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.logo{font-size:24px;font-weight:800}.logo span{font-weight:500;opacity:.7}.company{color:var(--muted);font-size:13px}.hero{background:linear-gradient(135deg,#171d35,#30265c);color:#fff;border-radius:22px;padding:34px;margin-bottom:26px}.hero h1{font-size:34px;margin:6px 0 8px}.hero p{color:rgba(255,255,255,.72);margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);border-radius:18px;padding:24px}.card small{color:var(--muted)}.card strong{display:block;font-size:30px;margin-top:8px}.primary-btn{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;cursor:pointer}@media(max-width:700px){.cards{grid-template-columns:1fr}.workspace{padding:24px}}</style>
</head><body><main class="workspace"><div class="top"><div class="logo">KOR<span>build</span></div><div class="company" id="company">Loading workspace...</div><button class="primary-btn" id="logout">Sign out</button></div><section class="hero"><p>TEAM OPERATIONS PLATFORM</p><h1>Welcome to your workspace</h1><p id="welcome">Loading your company profile...</p></section><section class="cards"><article class="card"><small>Active employees</small><strong id="employees">—</strong></article><article class="card"><small>Teams</small><strong id="teams">—</strong></article><article class="card"><small>Current period</small><strong id="period">—</strong></article></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="workspace.js"></script></body></html>
