<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KORbuild · Reminder Settings</title><link rel="stylesheet" href="home.css?v=26"><link rel="stylesheet" href="occurrence-form.css?v=1.2.2"><link rel="stylesheet" href="reminder-settings.css?v=1.0.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js?v=1.2.2"></script><script src="supabase-config.js?v=1.3.0"></script><script src="notification-bell.js?v=1.0.0"></script><script src="i18n.js?v=1.3.3"></script></head><body class="app-body"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="home.html" aria-label="KORbuild Dashboard"><div class="mini-mark">K</div><div>KOR<span>build</span></div><span class="demo-badge logo-demo">DEMO</span></a><nav></nav></aside><main class="main-content"><header class="topbar page-topbar"><div class="topbar-page-context page-identity"><strong>Reminder Settings</strong><small>Configure the automatic email sent to clients before their appointment.</small></div><div class="user-menu-wrap"><button id="user-menu-btn" class="user-menu-btn" aria-expanded="false"><span class="user-copy"><strong id="user-name">Owner</strong><small id="user-email"></small></span><span class="avatar" id="user-avatar">O</span><span class="chevron">⌄</span></button><div id="user-menu" class="user-menu hidden"></div></div></header><section class="form-page"><div class="form-card"><form id="reminder-form"><div class="form-grid">
<label><span>Channel *</span><select id="canal"><option value="email">Email</option><option value="sms" disabled>SMS (coming soon)</option><option value="whatsapp" disabled>WhatsApp (coming soon)</option></select></label>
<label><span>Send hours before *</span><input id="horas-antes" type="number" min="1" step="1" value="24" required></label>
<label class="switch-field"><span>Enabled</span><span class="switch-line"><input id="ativo" type="checkbox" checked><b id="active-label">Enabled</b></span></label>
<label class="full"><span>Email subject *</span><input id="template-assunto" required maxlength="200"></label>
<label class="full"><span>Email body *</span><textarea id="template-corpo" rows="6" required maxlength="2000"></textarea></label>
<p class="full form-hint">Available variables: <code>{{cliente_nome}}</code>, <code>{{data}}</code>, <code>{{hora}}</code>, <code>{{servico_nome}}</code>, <code>{{colaborador_nome}}</code></p>
</div><div id="message" class="message hidden"></div><div class="form-actions"><a class="secondary-btn" href="customer-schedule.html">Back to Calendar</a><button class="primary-btn" type="submit" id="save-btn">Save Settings</button></div></form>
<div class="reminder-preview">
  <div class="reminder-preview-head">PREVIEW</div>
  <div class="reminder-preview-subject" id="preview-subject">—</div>
  <div class="reminder-preview-body" id="preview-body">—</div>
</div>
</div></section></main><div class="app-version">KORbuild V1.2.2 · Development environment</div></div><script src="reminder-settings.js?v=1.0.0"></script></body></html>
